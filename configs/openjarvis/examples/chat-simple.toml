# Simple Chat — lightweight conversational AI, no tools
# Copy to ~/.aura/config.toml
#
# The fastest setup: just Ollama + a model.
#
# Usage:
#   aura ask "What is quantum computing?"
#   aura chat                  # interactive chat session
#   aura serve                 # start API server for browser/desktop app

[engine]
default = "ollama"

[intelligence]
default_model = "llama3.2:3b"       # Fast and lightweight
# default_model = "qwen2.5:7b"     # Better quality
# default_model = "llama3.1:8b"    # Alternative model

[agent]
default_agent = "simple"            # Single-turn, no tools

[server]
host = "127.0.0.1"
port = 8000
